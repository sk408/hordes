<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HORDES</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b12; overflow: hidden;
    overscroll-behavior: none;
    font-family: monospace;
  }
  /* Canvas is letterboxed by JS (fitCanvas in main.js): internal resolution
     stays 480x300, CSS size preserves aspect so pixels never stretch. */
  #wrap {
    position: relative; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #hud {
    position: absolute; top: 8px; left: 8px;
    color: #e8e8f0; font-size: 14px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000; pointer-events: none;
    white-space: pre-wrap;               /* was: pre - grew the box past the screen edge */
    max-width: calc(100vw - 16px);
  }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    /* safe center: long lists (SHOP now has 14 rows) scroll instead of
       clipping their top edge on small screens. */
    justify-content: safe center;
    background: rgba(5,5,10,0.75); color: #e8e8f0;
    flex-direction: column; gap: 12px;
    padding: 12px; box-sizing: border-box;
    overflow-y: auto;
  }
  #overlay h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 4px; }
  #overlay h1.logo {
    font-size: 46px; color: #ffd75e;
    text-shadow: 3px 3px 0 #7a1f33, 6px 6px 0 #000;
  }
  #overlay .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #overlay .sub br { line-height: 1.8; }
  /* ---- THEMED BUTTONS (owner 2026-09-14). Reference: a pixel-art SIGN that
     reads as part of the scene. U1b: the plaque is now an AUTHORED 9-slice
     pixel frame (src/art/menu_frame.js) painted through the renderer's
     drawGrid seam onto a canvas INSIDE each card — the CSS clip-path plaque
     is gone because the clip also clipped the card's own 0-blur drop-shadow,
     so the cards could never cast onto the screen art. The canvas is the
     card's box PLUS the shadow offset, so the cast shadow is painted pixels
     outside the card box. The card element itself stays transparent and
     keeps only layout + type; states repaint the canvas, never the CSS. */
  .card {
    width: 170px; padding: 14px; border: 0; cursor: pointer; text-align: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    position: relative; color: #f0dfc0;
    background: transparent;
  }
  /* the painted frame: inset 0 at the card's own pixel size plus the shadow
     spill (backing store sized in JS, 1 backing pixel = 1 CSS pixel — an
     INTEGER 3x on a dpr-3 phone — pixelated, no smoothing, no blur). Never
     interactive: the card stays the click target. */
  .card canvas.frame {
    position: absolute; left: 0; top: 0; display: block;
    pointer-events: none; z-index: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* every content layer sits above the painted frame */
  .card .name, .card .desc, .card .key, .card .syn,
  .card canvas.portrait, .card canvas.shop-icon { position: relative; z-index: 1; }
  .card:active { transform: translateY(1px); }
  .card.dim { opacity: 0.45; }
  .card.dim:hover { cursor: default; }
  .card .name {
    color: #ffd75e; font-weight: bold; margin-bottom: 8px;
    letter-spacing: 1px; text-shadow: 2px 2px 0 #0a0603;
    position: relative;
  }
  /* caret sits OUTSIDE the centred text run (absolute), so it cannot skew the
     title's centring — a visual read caught the title pushed right */
  .card .name::before {
    content: '\2023'; position: absolute; left: 8px; color: #c9a05a;
  }
  .card:hover .name::before { color: #ffd75e; }
  /* body copy lifts OFF the grain with a hard 1px shadow (a visual read found
     the text sitting "in" the grain and reading muddy) */
  .card .desc { font-size: 12px; color: #d6c09a; text-shadow: 1px 1px 0 #0a0603; }
  /* WAVE-26 draft synergy hint: a real, code-backed pair with something the
     player already owns. Cyan so it reads as information, not flavor text;
     absent entirely when the card has no genuine synergy. */
  .card .syn {
    margin-top: 8px; font-size: 11px; color: #7ad0ff;
    letter-spacing: 1px;
  }
  .card .key { margin-top: 10px; font-size: 11px; color: #6a6a8a; }
  /* ---- G13 CHARACTER SELECTOR: the authored 32x32 idle busts as LIVE
     canvases inside the pilot cards. The backing store stays 32x32 (the
     pixel grid itself, painted by the renderer's own drawGrid); CSS scales
     it by an INTEGER factor (2) with pixelated rendering — no smoothing, no
     blur, per house rules. The kit panel is one wide card at the top. */
  .card canvas.portrait {
    display: block; margin: 0 auto 8px;
    width: 64px; height: 64px;           /* 32x32 backing, integer 2x */
    background: #0e0e16;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* the equipped pilot's card is painted with the GOLD frame palette by
     frameCard (the old --hi/--lo custom props were never consumed) */
  .card.kit-card { width: min(92vw, 380px); text-align: left; cursor: default; }
  .card.kit-card .desc { font-size: 13px; line-height: 1.7; }
  /* G14 SHOP ICONS: every shop row carries its authored 16x16 icon as a live
     canvas — 16x16 backing store, INTEGER 2x CSS scale (32px), pixelated
     (same convention as the G13 portraits; no smoothing, no blur). */
  .card canvas.shop-icon {
    display: block; margin: 0 auto 8px;
    width: 32px; height: 32px;           /* 16x16 backing, integer 2x */
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #overlay .sub { font-size: 13px; color: #8888a8; text-align: center; }
  /* U1 HEADER (owner 2026-09-14): gold reads as a coin glyph + number, and the
     equipped pilot as their own bust. Both canvases are integer-scaled with
     pixelated rendering (no smoothing, no blur) — the coin is an 8x8 grid at
     2x, the bust is the authored 32x32 portrait at 2x, same convention as the
     character selector. */
  #overlay .sub .purse-row {
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  #overlay .sub canvas.coin {
    width: 16px; height: 16px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #overlay .sub .gold { color: #ffd75e; font-weight: bold; letter-spacing: 1px; }
  #overlay .sub .pass { color: #7ad0ff; font-size: 11px; letter-spacing: 1px; }
  #overlay .sub canvas.bust {
    display: block; margin: 6px auto 4px; width: 64px; height: 64px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* WAVE-26 "death as payoff": the end screen is the most-seen screen in the
     game, so its three facts get color-coded and scannable in one pass —
     cause (hot red), earnings (gold), and the next shop unlock (cool cyan).
     Monospace + no decoration: still the pixel look, just legible. */
  #overlay .sub .cause { color: #ff7a6a; }
  #overlay .sub .earn  { color: #ffd75e; }
  #overlay .sub .next  { color: #7ad0ff; }

  /* ---- WAVE-21 first-run tour (docs/FIRST_RUN_TOUR_2026-09-11.md): a
     staged spotlight walkthrough. #tour-root is appended to <body> (above
     every layer incl. #touch z5 and #overlay); four .tour-shade rects dim
     the screen except a padded hole around the live target, relaid out on
     a 120ms interval so the spotlight tracks moving UI. Click/tap anywhere
     advances; SKIP + Escape exits; each step's flag persists so it never
     replays uninvited. ---- */
  #tour-root {
    position: fixed; inset: 0; z-index: 50;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .tour-shade { position: absolute; background: rgba(5,5,10,0.78); }
  #tour-tip {
    position: absolute; max-width: 220px;
    padding: 8px 10px; box-sizing: border-box;
    background: #14141f; border: 2px solid #ffd75e;
    color: #e8e8f0; font-size: 13px; line-height: 1.45;
    cursor: pointer;
  }
  #tour-tip .tour-hint { display: block; margin-top: 6px; font-size: 10px; color: #6a6a8a; letter-spacing: 1px; }
  #tour-tip .tour-skip { color: #ff5a3c; text-decoration: underline; }

  /* ---- Touch control layer (Sk408): shown on coarse pointers / touch
     devices; buttons route through the same actions as the keyboard. ---- */
  #touch {
    position: fixed; inset: 0; display: none;
    pointer-events: none; z-index: 5;
  }
  #touch.on { display: block; }
  @media (pointer: coarse) { #touch { display: block; } }
  /* WAVE-22b DESKTOP MENU BUTTON (Sk408): the cog is the in-run menu —
     without the touch layer, desktop had NO on-screen way to reach settings
     (zoom, END RUN, replay tour). WAVE-23 (#6): non-touch devices get the
     full layer (main.js adds .cog-only) — the pads are real mouse-clickable
     buttons (parity with touch), NOT zero-sized ghosts. The joystick is
     pointer-captured, so it mouse-drags too when MANUAL is bound (WASD
     remains the keyboard path). */
  #touch.cog-only { display: block; }
  #touch.cog-only button { cursor: pointer; }
  #touch.cog-only #joy { cursor: grab; }
  /* WAVE-23 desktop refinement (post-audit): a mouse user does not need
     thumb-sized 56px targets, and at 0.85 opacity the pads sat on top of the
     arena's bottom corners. On the fine-pointer desktop they dim to 0.55,
     snapping back to full opacity while the cursor is over them. Touch /
     hybrid (#touch.on) keeps the full-size layer untouched — this block is
     cog-only devices. H1: the old 44px click-target shrink is gone — the
     no-reflow contract (#touch .pad button below: fixed 64px height holding
     the badge's reserved two-line box) applies to this variant too, so its
     min-width/min-height knobs were dead declarations and are removed. */
  #touch.cog-only .pad button { font-size: 12px; }
  #touch.cog-only .pad { opacity: 0.55; }
  #touch.cog-only .pad:hover { opacity: 1; }
  #touch .pad {
    position: absolute;
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    display: flex; flex-direction: column; gap: 10px;
    /* H1 (Sk408: "the on screen controls fluctuate in size during a run"):
       the pad width is FIXED, never text-driven. With no width here the live
       badge text (updateTouchHud) set the pad's max-content width and swung
       the left pad 74.97px -> 147.22px mid-run. 96px is the budget the
       repo's layout math (test/smoke.mjs, tools/verify_skill_keys.mjs)
       already assumes; at 96 the centered 120px joystick clears both pads
       at 360px (gap 14) and 390px (gap 29). Both pads identical, so the
       WAVE-17 "equal pads" claim below is finally literally true. */
    width: 96px;
    pointer-events: auto;
  }
  #touch .pad.left { left: max(10px, env(safe-area-inset-left, 10px)); }
  #touch .pad.right { right: max(10px, env(safe-area-inset-right, 10px)); }
  /* WAVE-17 BALANCE (Sk408): both pads are identical single-column 4-button
     stacks (the old HP/MP side-by-side pair made the right pad ~2x wider so
     the centered joystick looked pushed left). Equal pads + the centered
     joystick split the side gaps equally at every width — verified by layout
     math in test/smoke.mjs. */
  /* WAVE-15 analog joystick (replaces the WAVE-13 d-pad, Sk408 playtest):
     circular base + drag knob, shown only while the manual pilot is bound
     (main.js toggles display). Drag vector = knob offset from center,
     clamped to the base radius; ~15% dead zone; release recenters. */
  #joy {
    display: none;
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom, 14px));
    left: 50%; margin-left: -60px;      /* 120px base, centered */
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(20,20,31,0.72);
    border: 3px solid #4a4a6a;
    box-shadow: inset 0 0 0 6px rgba(74,74,106,0.25);
    pointer-events: auto;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  /* pixel-style ring guides: four cardinal notches via inset shadows */
  #joy::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 6px,  #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at 50% calc(100% - 6px), #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at 6px 50%,  #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 6px) 50%, #4a4a6a 3px, transparent 4px);
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;  /* centered */
    border-radius: 50%;
    background: #2a2a3a;
    border: 3px solid #6a6a8a;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.12);
    transform: translate(0px, 0px);   /* main.js drives the drag offset */
  }
  #joy-knob:active { border-color: #ffd75e; }
  #touch button {
    min-width: 68px; min-height: 56px; padding: 6px 12px;
    font-family: monospace; font-size: 13px; line-height: 1.3;
    color: #e8e8f0; background: rgba(20,20,31,0.85);
    border: 2px solid #4a4a6a; border-radius: 10px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  /* H1: pad buttons fill the FIXED pad and so can never size it — width 100%
     of the 96px pad (border-box, so padding and border stay inside) and a
     fixed HEIGHT, so no badge text can change any dimension. 64px = the
     measured two-line-badge case (62.89/63.48px) rounded up to an integer:
     6+6 padding + 16.9 label line + 2 badge margin + 28.6 badge box + 4
     border = 63.5 <= 64. The .cog-only desktop variant inherits the same
     guarantee through this rule. */
  #touch .pad button { width: 100%; box-sizing: border-box; height: 64px; }
  #touch button:active { border-color: #ffd75e; background: #1c1c2c; }
  #touch button .badge {
    display: block; font-size: 11px; color: #ffd75e; margin-top: 2px;
    /* H1: the badge RESERVES its box — min-height is the measured two-line
       height (28.59px), wrapping allowed, NEVER clipped: the pilot badge is
       the doctrine's only on-screen home for FLEE/LOOT/PATROL and must stay
       fully readable at every value (a clip variant was measured and
       REJECTED). Content can never change a dimension now. */
    min-height: 28.6px; white-space: normal; overflow-wrap: anywhere;
  }
  /* WAVE-28 KEY LETTERS (playtest: "put a [Q] and [E] by the timer"). The badge
     below the label is the LIVE cooldown readout (RDY / LOW / 8.0s, written by
     updateTouchHud) and stays exactly that — so the key lives INLINE ahead of
     the label instead, boxed like a key cap so it reads as a key and not as
     part of the skill name. Pixel-art styling (monospace, 1px hard border, 3px
     radius) matches .badge and the cog.
     SIZING IS MEASURED, not assumed (tools/verify_skill_keys.mjs, real Chrome
     at 390x844 dpr3 coarse pointer): the buttons are border-box, so the 68px
     min-width leaves a 40px content box and "FROST" at 13px monospace already
     fills it — the letters therefore DO grow the skill buttons, 68 -> 94.2px,
     and (flex column) the whole right pad with them. That is deliberate and
     still inside the 96px per-button budget index.html's pad math is written
     against, and it moves the right pad TOWARD the 114.09px left pad (joystick
     clearance 360px: 15.8px). Height is untouched (the 16px key box sits in the
     label's 16.9px line box) and the key's box never touches the badge's. */
  #touch button .key {
    display: inline-block; margin-right: 3px; padding: 0 2px;
    font-size: 10px; line-height: 14px; vertical-align: 1px;
    color: #b8e0ff; background: rgba(74,74,106,0.4);
    border: 1px solid #4a4a6a; border-radius: 3px;
  }
  /* WAVE-17 SETTINGS COG (Sk408): small pixel gear, top-right of the touch
     layer — screen chrome, kept OUT of the bottom thumb zone. Opens the
     in-run SETTINGS pause screen (main.js openSettings: same pause contract
     as the FIELD REPORT; BACK/ESC resumes). Gear drawn in pure CSS: ring
     body + 8 box-shadow teeth, no image assets. */
  #touch button.cog {
    position: absolute;
    top: max(10px, env(safe-area-inset-top, 10px));
    right: max(10px, env(safe-area-inset-right, 10px));
    width: 46px; height: 46px; min-width: 0; min-height: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .cog-gear { position: relative; width: 18px; height: 18px; }
  .cog-gear::before {          /* ring body */
    content: ''; position: absolute; inset: 3px;
    border: 3px solid #e8e8f0; border-radius: 50%;
  }
  .cog-gear::after {           /* 8 teeth: 4 cardinal + 4 diagonal dots */
    content: ''; position: absolute; left: 8px; top: 0;
    width: 2px; height: 2px; background: #e8e8f0;
    box-shadow:
      -8px 0 0 #e8e8f0, 8px 0 0 #e8e8f0,
      0 16px 0 #e8e8f0,
      -8px 16px 0 #e8e8f0, 8px 16px 0 #e8e8f0,
      -8px 8px 0 #e8e8f0, 8px 8px 0 #e8e8f0;
  }
  #touch button.cog:active .cog-gear::before { border-color: #ffd75e; }
  #touch button.cog:active .cog-gear::after {
    background: #ffd75e;
    box-shadow:
      -8px 0 0 #ffd75e, 8px 0 0 #ffd75e,
      0 16px 0 #ffd75e,
      -8px 16px 0 #ffd75e, 8px 16px 0 #ffd75e,
      -8px 8px 0 #ffd75e, 8px 8px 0 #ffd75e;
  }
  /* WAVE-22c "?" button (Sk408): desktop on-screen control hints — a small
     text "?" sits beside the cog (all devices; the hints panel itself
     defaults to desktop-only) and toggles the #hints key list. */
  #touch button.cog.help {
    right: max(64px, calc(env(safe-area-inset-right, 10px) + 54px));
    font-size: 16px; font-weight: bold; color: #e8e8f0;
  }
  /* A2 RADAR button: the radar's on-screen toggle, a third top-right chrome
     button in the cog row (left of "?"), so it never touches the H1 pad
     geometry. Routes data-act="radar" through runAction like every other
     touch action. While the radar is on main.js adds .on (updateTouchHud,
     every frame) — a lit gold frame is its readout; no badge text. */
  #touch button.cog.radar {
    right: max(118px, calc(env(safe-area-inset-right, 10px) + 108px));
    font-size: 14px; font-weight: bold; color: #e8e8f0;
  }
  #touch button.cog.radar.on { border-color: #ffd75e; color: #ffd75e; }
  /* M1 MAP button: the per-run map screen's touch entry (the owner plays on
     a phone — C6), a fourth top-right chrome button in the cog row (left of
     the RADAR button), so it never touches the H1 pad geometry. Routes
     data-act="map" through runAction like every other touch action. While
     the map is open main.js adds .on (updateTouchHud, every frame) — a lit
     gold frame is its readout; no badge text. */
  #touch button.cog.map {
    right: max(172px, calc(env(safe-area-inset-right, 10px) + 162px));
    font-size: 14px; font-weight: bold; color: #e8e8f0;
  }
  #touch button.cog.map.on { border-color: #ffd75e; color: #ffd75e; }
  /* The hints panel: compact one-glance key list, top-right under the cog.
     Shown only when main.js adds .on (persisted pref; default = non-touch).
     WAVE-23 (#6): the primary desktop reference — 14px, full-contrast text
     with a black knock-out shadow (the old 11px low-grey was the least
     readable thing on screen). */
  #hints {
    position: absolute;
    top: 64px; right: max(10px, env(safe-area-inset-right, 10px));
    display: none; padding: 9px 12px;
    font-size: 14px; line-height: 1.8; color: #e8e8f0; text-align: left;
    text-shadow: 1px 1px 0 #000;
    background: rgba(20,20,31,0.88); border: 2px solid #5a5a7a; border-radius: 10px;
    pointer-events: none; z-index: 6; white-space: nowrap;
  }
  #hints.on { display: block; }

  /* Bigger tap targets for draft cards on small/touch screens. */
  @media (pointer: coarse), (max-width: 700px) {
    /* A centred flex container whose content is taller than it squeezes its rows
       instead of scrolling, which is what stacked the guide/gallery buttons on top
       of each other. Top-align it and let it scroll. */
    #overlay { align-items: flex-start; overflow-y: auto; overscroll-behavior: contain;
               padding: 10px 8px 14px; }
    /* c4aee80's top-align is needed for the wrapped card rows (it is what stopped the
       guide/gallery buttons stacking) but it also shrink-wraps the heading and the
       sub-lines and pins them left. Centre only those; the card rows keep top-align. */
    #overlay > h1, #overlay > .sub { align-self: center; }
    #overlay .cards { flex-wrap: wrap; justify-content: center; align-content: flex-start;
                      gap: 10px; width: 100%; }
    .card { width: min(30vw, 172px); min-height: 0; padding: 12px 10px; margin-bottom: 2px; }
    .card .desc { font-size: 13px; }
    .card .key { display: none; } /* no number keys on touch; just tap */
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="touch">
    <div class="pad left">
      <button data-act="focus">FOCUS<span class="badge" id="tc-focus">NEAREST</span></button>
      <button data-act="stance">STANCE<span class="badge" id="tc-stance">BALANCED</span></button>
      <button data-act="pilot">PILOT<span class="badge" id="tc-pilot">AUTO</span></button>
      <button data-act="stats" id="tc-stats">STATS</button>
    </div>
    <div id="joy" data-joy="1"><div id="joy-knob"></div></div>
    <div class="pad right">
      <button data-act="q"><span class="key">[Q]</span><span id="q-skill">FROST</span><span class="badge" id="tc-q">RDY</span></button>
      <button data-act="w"><span class="key">[E]</span>OVER<span class="badge" id="tc-w">RDY</span></button>
      <button data-act="h">HP<span class="badge" id="tc-h">1</span></button>
      <button data-act="n">MP<span class="badge" id="tc-n">1</span></button>
    </div>
    <button class="cog" id="tc-cog" data-act="settings" aria-label="settings"><span class="cog-gear"></span></button>
    <button class="cog help" id="tc-help" data-act="help" aria-label="controls">?</button>
    <button class="cog radar" id="tc-radar" data-act="radar" aria-label="radar">R</button>
    <button class="cog map" id="tc-map" data-act="map" aria-label="map">M</button>
  </div>
  <!-- WAVE-25 (audit 2.11): the authored key list that used to sit here was
       dead markup — applyHints()/refreshHints() (main.js) overwrite this
       element's innerHTML at module load with the mode-aware AUTO/MANUAL
       variant, so the static copy was never rendered and had already drifted
       once. The element stays as the hook; main.js owns the content. -->
  <div id="hints"></div>
  <div id="overlay">
    <h1 id="ov-title">HORDES</h1>
    <div class="sub" id="ov-sub"></div>
    <div class="cards" id="ov-cards"></div>
    <!-- DRAFT INSPECT BOX (R2, owner directive 2026-09-14): the first
         activation on a draft card opens this — art, name, computed effect —
         the second takes it. Content + styling are main.js's (the stylesheet
         is another track's file); the element stays as the hook. -->
