<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HORDES</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b12; overflow: hidden;
    overscroll-behavior: none;
    font-family: monospace;
  }
  /* Canvas is letterboxed by JS (fitCanvas in main.js): internal resolution
     stays 480x300, CSS size preserves aspect so pixels never stretch. */
  #wrap {
    position: relative; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #hud {
    position: absolute; top: 8px; left: 8px;
    color: #e8e8f0; font-size: 14px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000; pointer-events: none;
    white-space: pre;
  }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    /* safe center: long lists (SHOP now has 14 rows) scroll instead of
       clipping their top edge on small screens. */
    justify-content: safe center;
    background: rgba(5,5,10,0.75); color: #e8e8f0;
    flex-direction: column; gap: 12px;
    padding: 12px; box-sizing: border-box;
    overflow-y: auto;
  }
  #overlay h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 4px; }
  #overlay h1.logo {
    font-size: 46px; color: #ffd75e;
    text-shadow: 3px 3px 0 #7a1f33, 6px 6px 0 #000;
  }
  #overlay .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #overlay .sub br { line-height: 1.8; }
  .card {
    width: 170px; padding: 14px; border: 2px solid #4a4a6a;
    background: #14141f; cursor: pointer; text-align: center;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .card:hover { border-color: #d0d0ff; background: #1c1c2c; }
  .card.dim { opacity: 0.45; }
  .card.dim:hover { border-color: #4a4a6a; background: #14141f; cursor: default; }
  .card .name { color: #ffd75e; font-weight: bold; margin-bottom: 8px; }
  .card .desc { font-size: 12px; color: #a8a8c0; }
  .card .key { margin-top: 10px; font-size: 11px; color: #6a6a8a; }
  #overlay .sub { font-size: 13px; color: #8888a8; text-align: center; }

  /* ---- Touch control layer (Sk408): shown on coarse pointers / touch
     devices; buttons route through the same actions as the keyboard. ---- */
  #touch {
    position: fixed; inset: 0; display: none;
    pointer-events: none; z-index: 5;
  }
  #touch.on { display: block; }
  @media (pointer: coarse) { #touch { display: block; } }
  #touch .pad {
    position: absolute;
    bottom: max(10px, env(safe-area-inset-bottom, 10px));
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: auto;
  }
  #touch .pad.left { left: max(10px, env(safe-area-inset-left, 10px)); }
  #touch .pad.right { right: max(10px, env(safe-area-inset-right, 10px)); }
  /* WAVE-17 BALANCE (Sk408): both pads are identical single-column 4-button
     stacks (the old HP/MP side-by-side pair made the right pad ~2x wider so
     the centered joystick looked pushed left). Equal pads + the centered
     joystick split the side gaps equally at every width — verified by layout
     math in test/smoke.mjs. */
  /* WAVE-15 analog joystick (replaces the WAVE-13 d-pad, Sk408 playtest):
     circular base + drag knob, shown only while the manual pilot is bound
     (main.js toggles display). Drag vector = knob offset from center,
     clamped to the base radius; ~15% dead zone; release recenters. */
  #joy {
    display: none;
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom, 14px));
    left: 50%; margin-left: -60px;      /* 120px base, centered */
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(20,20,31,0.72);
    border: 3px solid #4a4a6a;
    box-shadow: inset 0 0 0 6px rgba(74,74,106,0.25);
    pointer-events: auto;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  /* pixel-style ring guides: four cardinal notches via inset shadows */
  #joy::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 6px,  #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at 50% calc(100% - 6px), #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at 6px 50%,  #4a4a6a 3px, transparent 4px),
      radial-gradient(circle at calc(100% - 6px) 50%, #4a4a6a 3px, transparent 4px);
  }
  #joy-knob {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;  /* centered */
    border-radius: 50%;
    background: #2a2a3a;
    border: 3px solid #6a6a8a;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.12);
    transform: translate(0px, 0px);   /* main.js drives the drag offset */
  }
  #joy-knob:active { border-color: #ffd75e; }
  #touch button {
    min-width: 68px; min-height: 56px; padding: 6px 12px;
    font-family: monospace; font-size: 13px; line-height: 1.3;
    color: #e8e8f0; background: rgba(20,20,31,0.85);
    border: 2px solid #4a4a6a; border-radius: 10px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #touch button:active { border-color: #ffd75e; background: #1c1c2c; }
  #touch button .badge {
    display: block; font-size: 11px; color: #ffd75e; margin-top: 2px;
  }
  /* WAVE-17 SETTINGS COG (Sk408): small pixel gear, top-right of the touch
     layer — screen chrome, kept OUT of the bottom thumb zone. Opens the
     in-run SETTINGS pause screen (main.js openSettings: same pause contract
     as the FIELD REPORT; BACK/ESC resumes). Gear drawn in pure CSS: ring
     body + 8 box-shadow teeth, no image assets. */
  #touch button.cog {
    position: absolute;
    top: max(10px, env(safe-area-inset-top, 10px));
    right: max(10px, env(safe-area-inset-right, 10px));
    width: 46px; height: 46px; min-width: 0; min-height: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .cog-gear { position: relative; width: 18px; height: 18px; }
  .cog-gear::before {          /* ring body */
    content: ''; position: absolute; inset: 3px;
    border: 3px solid #e8e8f0; border-radius: 50%;
  }
  .cog-gear::after {           /* 8 teeth: 4 cardinal + 4 diagonal dots */
    content: ''; position: absolute; left: 8px; top: 0;
    width: 2px; height: 2px; background: #e8e8f0;
    box-shadow:
      -8px 0 0 #e8e8f0, 8px 0 0 #e8e8f0,
      0 16px 0 #e8e8f0,
      -8px 16px 0 #e8e8f0, 8px 16px 0 #e8e8f0,
      -8px 8px 0 #e8e8f0, 8px 8px 0 #e8e8f0;
  }
  #touch button.cog:active .cog-gear::before { border-color: #ffd75e; }
  #touch button.cog:active .cog-gear::after {
    background: #ffd75e;
    box-shadow:
      -8px 0 0 #ffd75e, 8px 0 0 #ffd75e,
      0 16px 0 #ffd75e,
      -8px 16px 0 #ffd75e, 8px 16px 0 #ffd75e,
      -8px 8px 0 #ffd75e, 8px 8px 0 #ffd75e;
  }

  /* Bigger tap targets for draft cards on small/touch screens. */
  @media (pointer: coarse), (max-width: 700px) {
    #overlay .cards { flex-wrap: wrap; justify-content: center; }
    .card { width: min(30vw, 180px); min-height: 96px; padding: 16px 12px; }
    .card .desc { font-size: 13px; }
    .card .key { display: none; } /* no number keys on touch; just tap */
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="touch">
    <div class="pad left">
      <button data-act="focus">FOCUS<span class="badge" id="tc-focus">NEAREST</span></button>
      <button data-act="stance">STANCE<span class="badge" id="tc-stance">BALANCED</span></button>
      <button data-act="pilot">PILOT<span class="badge" id="tc-pilot">AUTO</span></button>
      <button data-act="stats">STATS</button>
    </div>
    <div id="joy" data-joy="1"><div id="joy-knob"></div></div>
    <div class="pad right">
      <button data-act="q">FROST<span class="badge" id="tc-q">RDY</span></button>
      <button data-act="w">OVER<span class="badge" id="tc-w">RDY</span></button>
      <button data-act="h">HP<span class="badge" id="tc-h">1</span></button>
      <button data-act="n">MP<span class="badge" id="tc-n">1</span></button>
    </div>
    <button class="cog" id="tc-cog" data-act="settings" aria-label="settings"><span class="cog-gear"></span></button>
  </div>
  <div id="overlay">
    <h1 id="ov-title">HORDES</h1>
    <div class="sub" id="ov-sub"></div>
    <div class="cards" id="ov-cards"></div>
    <div class="sub">1 / 2 / 3 or tap a card &middot; TAB focus &middot; G stance &middot; Q frost / E overcharge &middot; H / N potions &middot; M pilot (WASD+arrows manual) &middot; + / - zoom &middot; S or I stats &middot; or the on-screen buttons</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
